<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>check vowels</h2>
    <label for="">Enter character : </label>
    <input type="text" placeholder="enter character" id="ch"><br>
    <label for="">vowel or not : </label>
    <input type="text" id="vowel" readonly><br>
    <button onclick="vowel()">check</button>


    <h2>check given number is between 1 to 10</h2>
    <label for="">Enter number : </label>
    <input type="text" placeholder="enter number" id="n1"><br>
    <label for="">between 1 and 10: </label>
    <input type="text" id="number" readonly><br>
    <button onclick="num()">check</button>


    <h2>character is upper case or not</h2>
    <label for="">Enter character : </label>
    <input type="text" placeholder="enter character" id="n2"><br>
    <label for="">uppercase or not: </label>
    <input type="text" id="upper" readonly><br>
    <button onclick="upper()">check</button>

    <h2>character is alphabet or not</h2>
    <label for="">Enter character : </label>
    <input type="text" placeholder="enter character" id="n3"><br>
    <label for="">alphabet or not: </label>
    <input type="text" id="alpha" readonly><br>
    <button onclick="alpha()">check</button>

    <h2>check given value is digit or not</h2>
    <label for="">Enter number : </label>
    <input type="text" placeholder="enter number" id="n4"><br>
    <label for="">digit or not : </label>
    <input type="text" id="digit" readonly><br>
    <button onclick="digit()">check</button>

    <h2>login form</h2>
    <label for="">Enter name : </label>
    <input type="text" placeholder="enter name" id="n5"><br>
    <label for="">Enter password : </label>
    <input type="text" placeholder="enter password" id="n6"><br>
    <label for="">login : </label>
    <input type="text" id="login" readonly><br>
    <button onclick="login()">login</button>

    <script type="text/javascript" src="ifelse.js"></script>
</body>
</html>
