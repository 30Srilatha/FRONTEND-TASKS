<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- positive or negative -->
     <h2>positive or negative</h2>
     <label for="">Enter number : </label>
     <input type="text" placeholder="enter number" id="n1" required><br>
     <label for="">positive or negative</label>
     <input type="text" readonly id="positive">
     <button onclick="positive()">check</button>
     <!-- smallest number -->
      <h2>smallest number</h2>
     <label for="">Enter first number : </label>
     <input type="text" placeholder="enter number" id="n2" required><br>
      <label for="">Enter second number : </label>
     <input type="text" placeholder="enter number" id="n3" required><br>
     <label for="">smallest number</label>
     <input type="text" readonly id="small">
     <button onclick="small()">check</button>

     <!-- divisible by 5 -->
       <h2>divisible by 5</h2>
     <label for="">Enter number : </label>
     <input type="text" placeholder="enter number" id="n4" required><br>
      <label for="">Result: </label>
     <input type="text" readonly id="by">
     <button onclick="divisible()">check</button>

     <!-- even or not -->
       <h2>even or not</h2>
     <label for="">Enter number : </label>
     <input type="text" placeholder="enter number" id="n5" required><br>
      <label for="">Result: </label>
     <input type="text" readonly id="even">
     <button onclick="even()">check</button>

     <!-- discount -->
      <h2>discount</h2>
     <label for="">Enter bill : </label>
     <input type="text" placeholder="enter number" id="n6" required><br>
      <label for="">Bill after discount: </label>
     <input type="text" readonly id="dis">
     <button onclick="discount()">check</button>

    <script type="text/javascript" src="if_else.js"></script>
</body>
</html>
