<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

       #circle1{
        height:300px;
        width:300px;
        border-radius: 300px;
        border:5px solid blue;
        display: flex;
        flex-direction: row;
        justify-content:center ;
        align-items: center;
        background-color: rgb(174, 174, 241);
    }
    #circle2{
        height:200px;
        width:200px;
        border-radius: 200px;
        border:5px solid red;
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: center;
        background-color: rgb(245, 164, 164);
    }
    #circle3{
        height:100px;
        width:100px;
        border-radius: 100px;
        border: 5px solid green;
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: center;
        background-color: rgb(170, 244, 170);

    }
    p{
        text-align: center;
        font-weight: 600;
        color:blue;
        text-shadow: 2px 2px 2px ;
    }

    </style>
</head>
<body>
    
    <div id="circle1">
        <div id="circle2">
            <div id="circle3">
                <p>FullStack Developers</p>
            </div>
        </div>
    </div>
    
</body>
</html>
