<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <table border="1" cellspacing="0" cellpadding="10">
            <tr>
                <!-- table1 -->
                <td>
                    <table width="280">
                        <tr>
                            <th>Login Form</th>
                        </tr>
                        <tr>
                            <td><hr>
                            <table border="1" cellspacing="0" align="center">
                                <tr>
                                    <td bgcolor="lavender">
                                        <label> <b>Username: </b></label>
                                        <input type="text">
                                    </td>
                                </tr>
                                <tr>
                                    <td bgcolor="lavender">
                                        <label><b>Password: </b></label>
                                        <input type="text">
                                    </td>
                                </tr>
                            </table>
                        </td>
                        </tr>
                        <tr>
                            <td><input type="checkbox"><b>Remember Me: </b>
                            </td>
                        </tr>
                        <tr>
                            <td><hr>
                            <input type="submit" value="Login">
                            <input type="submit" value="Reset">
                            </td>
                        </tr>
                    </table>

                </td>
                <!-- table2 -->
                <td colspan="2">
                    <table width="500">
                        <tr>
                            <th>Event Registration</th>
                        </tr>
                        <tr>
                            <td><hr>
                            <table border="1" cellspacing="0" bgcolor="lavender" align="center">
                                <tr>
                                    <td >
                                        <b>Username: </b></td>
                                        <td><input type="text">
                                    </td>
                                </tr>
                                <tr>
                                    <td >
                                        <b>Password: </b></td>
                                        <td><input type="text">
                                    </td>
                                </tr>
                                <tr>
                                    <td><b>Select Event: </b></td>
                                    <td>
                                        <select name="event">
                                            <option>Conference</option>
                                            <option>Workshop</option>
                                            <option>Seminar</option>
                                        </select>
                                    </td>
                                </tr>
                            </table>
                        </td>
                        <td>
                            <img src="https://images.unsplash.com/photo-1554719956-5c151ab80680?w=1000&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8OHx8YmFsbG9uc3xlbnwwfHwwfHx8MA%3D%3D" width="80" height="100">
                        </td>
                        </tr>
                        
                        <tr align="right">
                            <td>
                            <input type="submit" value="Register">
                            <input type="submit" value="Cancel">
                            </td>
                        </tr>
                    </table>

                </td>
            </tr>
            <tr>
                <!-- table3 -->
                <td>
                    <table width="280">
                        <th>Survey Form</th>
                        <tr>
                            <td><hr>
                            <table border="1" cellspacing="0" width="250" align="center">
                                <tr>
                                    <td bgcolor="lavender"><b>How satisfied are you?</b></td>
                                </tr>
                                <tr>
                                    <td>
                                        <input type="radio" value=" satisfied">Very satisfied <br>
                                        <input type="radio" value="satisfied">Neutral <br>
                                        <input type="radio" value="satisfied">Dissatisfied 
                                    </td>
                                </tr>
                            </table></td>
                        </tr>
                        <tr>
                            <td>
                                <table border="1" cellspacing="0" width="250">
                                    <tr>
                                        <td bgcolor="lavender">
                                            <b>Comments:</b><br>
                                            <textarea name="comments"></textarea>
                                        </td>
                                    </tr>
                                </table>
                            </td>
                        </tr>
                        <tr align="center">
                            <td>
                                <input type="submit" value="Submit">
                                <input type="submit" value="Clear">
                            </td>
                        </tr>
                    </table>
                </td>
                <!-- table4 -->
                <td>
                    <table>
                        <tr>
                        <th>Hotel Booking</th>
                        </tr>
                        <tr align="center">
                            <td><hr>
                                <img src="https://plus.unsplash.com/premium_photo-1682629632657-4ac307921295?w=1000&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NXx8YmVhY2h8ZW58MHx8MHx8fDA%3D" height="100" width="250">
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <table border="1" cellspacing="0" bgcolor="lavender">
                                    <tr>
                                        <td><label><b>Check-in Date: </b></label>
                                        <input type="text"></td>
                                    </tr>
                                    <tr>
                                        <td>
                                            <label><b>Check-out Date: </b></label>
                                            <input type="text">
                                        </td>
                                    </tr>
                                    <tr>
                                        <td>
                                            <b>Number of Guests: </b>
                                            <select> 
                                                <option>1</option>
                                            </select>

                                        </td>
                                    </tr>
                                </table>
                            </td>
                            <tr>
                                <td align="center">
                                <input type="submit" value="Book Now">
                                <input type="submit" value="Cancel">
                            </td>
                            </tr>
                        </tr>
                    </table>
                </td>

                <!-- table5 -->
                <td>
                    <table>
                        <tr>
                            <th>Job Application</th>
                        </tr>
                        <tr>
                            <td><hr>
                                <table border="1" cellspacing="0" bgcolor="lavender">
                                    <tr>
                                        <td><label><b>Full Name: </b></label>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                                            <input type="text">
                                        </td>
                                    </tr>
                                    <tr>
                                        <td>
                                            <label><b>Position Applied:</b></label>
                                            <input type="text">
                                        </td>
                                    </tr>
                                </table>
                                <tr>

                                <td>Qualifications:
                                    <ol type="numbers">
                                    <li>Resume Upload</li>
                                    <li>Cover Letter</li>
                                    <li>References</li>
                                </ol></td>
                                </tr>

                            </td>
                        </tr>
                        <tr align="center">
                            <td><hr>
                            <input type="submit" value="Apply">
                            <input type="submit" value="Reset"></td>
                        </tr>
                    </table>
                </td>

            </tr>
        </table>
    </form>
</body>
</html>
