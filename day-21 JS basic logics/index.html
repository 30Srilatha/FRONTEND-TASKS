<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Adding two numbers</h2>
    <label for="">Enter number 1 : </label>
    <input type="text" placeholder="enter number" id="n1"><br>
    <label for="">Enter number 2 : </label>
    <input type="text" placeholder="enter number" id="n2"><br>
    <label for="">Result : </label>
    <input type="text" placeholder="result" id="sum" readonly><br>
    <button onclick="add()">ADD</button>

    <h2>average of three numbers</h2>
    <label for="">Enter num1 : </label>
    <input type="text" placeholder="enter number" id="a"><br>
    <label for="">Enter num2 : </label>
    <input type="text" placeholder="enter number" id="b"><br>
    <label for="">Enter num3 : </label>
    <input type="text" placeholder="enter number" id="c"><br>
    <label for="">Average </label>
    <input type="text" placeholder="enter number" id="avg" readonly><br>
    <button onclick="avg()">AVERAGE</button>

    <h2>Sum of natural numbers</h2>
    <label for="">Enter number : </label>
    <input type="text" placeholder="enter number" id="n"><br>
    <label for="">sum of natural numbers:  </label>
    <input type="text" placeholder="enter number" id="natural" readonly><br>
    <button onclick="natural()">NATURAL</button>


    <h2>average of natural numbers</h2>
    <label for="">Enter number : </label>
    <input type="text" placeholder="enter number" id="num"><br>
    <label for="">avg of natural numbers:  </label>
    <input type="text" placeholder="enter number" id="avgnatural" readonly><br>
    <button onclick="avgnatural()">AVG NATURAL</button>

    <h2>missing angle</h2>
    <label for="">Enter angle1 : </label>
    <input type="text" placeholder="enter angle" id="a1"><br>
    <label for="">Enter angle2 : </label>
    <input type="text" placeholder="enter angle" id="a2"><br>
    <label for="">missing angle:  </label>
    <input type="text" placeholder="enter number" id="angle3" readonly><br>
    <button onclick="angle()">ANGLE 3</button>

    <h2>Profit</h2>
    <label for="">Enter selling price : </label>
    <input type="text" placeholder="enter sp" id="sp"><br>
    <label for="">Enter cost price : </label>
    <input type="text" placeholder="enter cp" id="cp"><br>
    <label for="">profit :  </label>
    <input type="text" placeholder="profit" id="profit" readonly><br>
    <button onclick="profit()">PROFIT</button>

    <h2>Simple interest</h2>
    <label for="">Enter principle : </label>
    <input type="text" placeholder="enter p value " id="p"><br>
    <label for="">Enter time : </label>
    <input type="text" placeholder="enter t value" id="t"><br>
    <label for="">Enter rate : </label>
    <input type="text" placeholder="enter r value" id="r"><br>
    <label for="">SimpleInterest :  </label>
    <input type="text" placeholder="SI" id="SI" readonly><br>
    <button onclick="simple()">SI</button>

    <script type="text/javascript" src="basicLogics.js"></script>
